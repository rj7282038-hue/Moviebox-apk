name: moviebox_mobile
description: "MovieBox Mobile - A powerful cross-platform streaming, IPTV and media app inspired by MovieBox-TUI."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  cached_network_image: ^3.3.1
  shared_preferences: ^2.2.3
  video_player: ^2.8.6
  provider: ^6.1.2
  intl: ^0.19.0
  flutter_spinkit: ^5.2.1
  url_launcher: ^6.3.0
  dio: ^5.4.3+1
  path_provider: ^2.1.3
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
